name: OreDial Cloud Social Enricher

on:
  schedule:
    # Off-peak minutes par har 15 min me chalega (5 runners x 120 = 600 leads/cycle)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  enrich-leads:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary requests beautifulsoup4 ddgs

      - name: Run Cloud Social Worker ${{ matrix.worker }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python social_engine_cloud.py